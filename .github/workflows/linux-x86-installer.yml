# Purpose: build one current Linux test kit and prove its fresh-user install on every supported Ubuntu release.
name: Linux v0.39 test kit

on:
  workflow_dispatch:
  push:
    branches: ["ci/linux-x86-v039-public"]

permissions:
  contents: read

env:
  RELEASE_ID: linux-hive-v0.39

jobs:
  baseline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hive-20261109
          sparse-checkout: |
            release/deploy/linux
            release/hive/core
      - name: Test the unchanged Linux installer before comparing the public successor
        run: |
          umask 077
          TMPDIR="$RUNNER_TEMP" python3 -B -m unittest discover -v -s release/deploy/linux -p 'test_*.py'
  build:
    runs-on: ubuntu-22.04
    env:
      PREFIX: omegahive-linux-v039
    steps:
      - uses: actions/checkout@v4
      - name: Use runner scratch outside the tested tree
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm the immutable release tree and test the Linux launcher
        run: |
          test "$(git rev-parse HEAD:release)" = "$(cat ci/RELEASE_TREE)"
          test "$(cat release/RELEASE_COMMIT)" = "$(cat ci/RELEASE_COMMIT)"
          umask 077
          python3 -B -m unittest discover -v -s release/deploy/linux -p 'test_*.py'
      - name: Export the source without generated UI or dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          cp ci/linux-x86/inputs/* "$RUNNER_TEMP/inputs/"
          # Entries dated at the release commit's time (ci/RELEASE_COMMIT_TIME), since a tree archive is otherwise
          # dated now and every run would make a different download from the same source.
          git archive --format=tar --mtime="$(cat ci/RELEASE_COMMIT_TIME)" --prefix="$PREFIX/" HEAD:release | gzip -n > "$RUNNER_TEMP/inputs/source.tar.gz"
      - name: Use the UI, the Omega core, Studio and the Code service from the Mac v0.39 build
        run: |
          cd ci/linux-x86/inputs
          sha256sum -c ui-dist.tar.gz.sha256
          sha256sum -c omega-core-*.bundle.sha256
          sha256sum -c omegadesign-*.zip.sha256
          sha256sum -c omegacode-*.tgz.sha256
          tar -xzf ui-dist.tar.gz -C "$GITHUB_WORKSPACE/release/hive/ui"
      - name: Fetch checksum-pinned uv and compile the current x86_64 lock
        run: |
          readarray -t PIN < <(python3 -c "import json; p=json.load(open('ci/linux-x86/x86_64-pins.json'))['uv']; print(p['url']); print(p['sha256'])")
          curl -fLsS "${PIN[0]}" -o "$RUNNER_TEMP/uv.tar.gz"
          printf '%s  %s\n' "${PIN[1]}" "$RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          python3 -B ci/linux-x86/minds_requirements.py --release release --out "$RUNNER_TEMP/minds.in"
          "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uv" --no-config pip compile \
            release/hive/requirements.txt ci/linux-x86/janus-runtime.in "$RUNNER_TEMP/minds.in" \
            --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes --no-header -o "$RUNNER_TEMP/inputs/core.lock"
      - name: Bind current input hashes, build the catalogue and pack the download
        run: |
          python3 -B ci/linux-x86/prepare_release.py --source release --inputs "$RUNNER_TEMP/inputs" \
            --catalogue ci/linux-x86/public-catalogue.json --tree "$(cat ci/RELEASE_TREE)" \
            --output "$RUNNER_TEMP/catalogue.json" --built-with "Mac v0.39 vite build; provenance ci/linux-x86/mac-zip-inputs.json"
          python3 -I -B -S ci/linux-x86/make_catalogue.py \
            --base-catalogue "$RUNNER_TEMP/catalogue.json" --pins ci/linux-x86/x86_64-pins.json \
            --source-tar "$RUNNER_TEMP/inputs/source.tar.gz" --prefix "$PREFIX" \
            --commit "$(cat ci/RELEASE_COMMIT)" --tree "$(cat ci/RELEASE_TREE)" \
            --inputs "$RUNNER_TEMP/inputs" --bundle "$RUNNER_TEMP/bundle" --release-id "$RELEASE_ID"
          mkdir -p "$RUNNER_TEMP/kit"
          python3 -I -B ci/linux-x86/pack_kit.py --bundle "$RUNNER_TEMP/bundle" \
            --template release/deploy/linux/installer.sh --out "$RUNNER_TEMP/kit/omegahive-linux.sh"
          cd "$RUNNER_TEMP/kit"
          sha256sum -c omegahive-linux.sh.sha256
          stat -c '%s %n' omegahive-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omegahive-linux-v039-kit
          path: ${{ runner.temp }}/kit/
      - uses: actions/upload-artifact@v4
        with:
          name: omegahive-linux-v039-bundle
          path: ${{ runner.temp }}/bundle/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v039-build-inputs
          path: |
            ${{ runner.temp }}/catalogue.json
            ${{ runner.temp }}/inputs/core.lock
            ${{ runner.temp }}/inputs/ui-dist.manifest.json

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        entry: [install, kit]
    runs-on: ${{ matrix.os }}
    env:
      HIVE_USER: hiveuser
    steps:
      - uses: actions/checkout@v4
      - name: Use runner scratch outside the tested tree
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: omegahive-linux-v039-kit
          path: ${{ runner.temp }}/kit
      - uses: actions/download-artifact@v4
        with:
          name: omegahive-linux-v039-bundle
          path: ${{ runner.temp }}/bundle
      - name: Fresh user with test-only permission for the installer's fixed system setup commands
        run: |
          uname -a
          lsb_release -ds
          # A fresh 24.04 or 26.04 computer lets only programs whose AppArmor profile grants userns make user namespaces.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          printf 'AppArmor userns restriction on this runner: %s\n' "$(cat "$restriction" 2>/dev/null || echo absent)"
          case "$(lsb_release -rs)" in 24.04|26.04) sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1;; esac
          sudo sh ci/linux-x86/test_account.sh "$HIVE_USER" "$RELEASE_ID"
          cd "$RUNNER_TEMP/kit"
          sha256sum -c omegahive-linux.sh.sha256
          sudo install -o "$HIVE_USER" -m 0600 omegahive-linux.sh "/home/$HIVE_USER/omegahive-linux.sh"
          sudo cp -r "$RUNNER_TEMP/bundle" "/home/$HIVE_USER/bundle"
          sudo cp "$GITHUB_WORKSPACE/ci/linux-x86/run_install.py" "$GITHUB_WORKSPACE/ci/linux-x86/trace_helper.py" "/home/$HIVE_USER/"
          sudo chown -R "$HIVE_USER:$HIVE_USER" "/home/$HIVE_USER"
      - name: Run the exact download or its installer entry as the fresh user
        env:
          ENTRY: ${{ matrix.entry }}
        run: |
          if [ "$ENTRY" = install ]; then
            readarray -t PIN < <(python3 -c "import json; p=json.load(open('ci/linux-x86/x86_64-pins.json'))['python_stripped']; print(p['url']); print(p['sha256'])")
            curl -fLsS "${PIN[0]}" -o "$RUNNER_TEMP/python.tar.gz"
            printf '%s  %s\n' "${PIN[1]}" "$RUNNER_TEMP/python.tar.gz" | sha256sum -c -
            sudo tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "/home/$HIVE_USER"
            sudo chown -R "$HIVE_USER:$HIVE_USER" "/home/$HIVE_USER/python"
            # shellcheck disable=SC2088
            COMMAND='~/python/bin/python3.12 -I -B -S ~/run_install.py ~/bundle'
          else
            COMMAND='sh ~/omegahive-linux.sh'
          fi
          set +e
          # The runner owns this log; sudo changes only the installer's identity.
          # shellcheck disable=SC2024
          sudo -iu "$HIVE_USER" bash -c "umask 077; script -qec '$COMMAND' /dev/null" > "$RUNNER_TEMP/install.out" 2>&1
          code=$?
          set -e
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install.out"
          if [ "$code" != 0 ]; then
            # shellcheck disable=SC2016,SC2024
            sudo bash -c 'tail -n 150 -- "$1"/.local/share/omegahive/logs/install-*.log' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/install-log.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install-log.out"
            # shellcheck disable=SC2024
            sudo -iu "$HIVE_USER" env XDG_RUNTIME_DIR="/run/user/$(id -u "$HIVE_USER")" journalctl --user -u omegahive.service --no-pager -n 80 > "$RUNNER_TEMP/journal.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/journal.out"
          fi
          exit "$code"
      - name: Export the installed Ubuntu 22.04 runtime without conversations or auth data
        if: matrix.os == 'ubuntu-22.04' && matrix.entry == 'kit'
        run: |
          mkdir -p "$RUNNER_TEMP/installed-runtime"
          id -u "$HIVE_USER" > "$RUNNER_TEMP/installed-runtime/uid.txt"
          sudo tar -C "/home/$HIVE_USER" --exclude='*/runtime/swipl-build' --exclude='*/runtime/swipl-source' \
            -czf "$RUNNER_TEMP/installed-runtime/runtime.tar.gz" \
            .local/share/omegahive/releases .local/share/omegahive/runtime.json \
            .local/share/omegahive/installation-state.json .local/share/omegahive/bin .local/bin/omegahive \
            .config/systemd/user/omegahive.service .cache/omegahive
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/installed-runtime/runtime.tar.gz"
          cd "$RUNNER_TEMP/installed-runtime"
          sha256sum runtime.tar.gz > runtime.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04' && matrix.entry == 'kit'
        with:
          name: linux-v039-installed-runtime
          path: ${{ runner.temp }}/installed-runtime/
      - name: Open, sign in, restart, log out, and restart the user manager
        run: |
          sudo python3 ci/linux-x86/smoke_release.py verify "$HIVE_USER" "$RUNNER_TEMP/verification.json"
      - name: Retain secret-free verification receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install.out" > "$RUNNER_TEMP/receipts/install.out"
          # shellcheck disable=SC2016,SC2024
          sudo bash -c 'cat -- "$1"/.local/share/omegahive/logs/install-*.log' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/install-log.raw" 2>&1 || true
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install-log.raw" > "$RUNNER_TEMP/receipts/install-log.txt"
          test ! -f "$RUNNER_TEMP/verification.json" || cp "$RUNNER_TEMP/verification.json" "$RUNNER_TEMP/receipts/"
          git rev-parse HEAD > "$RUNNER_TEMP/receipts/installer-commit.txt"
          lsb_release -ds > "$RUNNER_TEMP/receipts/os.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v039-${{ matrix.os }}-${{ matrix.entry }}-receipts
          path: ${{ runner.temp }}/receipts/

  # A v0.37 tester's way to this build: the published v0.37 kit, `omegahive uninstall` keeping conversations, then this
  # kit over the kept data folder. A fresh install can't catch what the older release leaves behind.
  upgrade:
    needs: build
    runs-on: ubuntu-26.04
    env:
      HIVE_USER: hiveuser
      OLD_KIT_URL: https://github.com/omega-flagship/omegahive-installer/releases/download/linux-hive-v0.37/omegahive-linux.sh
      OLD_KIT_SHA256: 09a9ce318c07bbeb805863522bd725d75459c1285698617047711365faf58555
    steps:
      - uses: actions/checkout@v4
      - name: Use runner scratch outside the tested tree
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: omegahive-linux-v039-kit
          path: ${{ runner.temp }}/kit
      - name: Fresh user allowed both releases' fixed system setup commands, with the published v0.37 kit
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo sh ci/linux-x86/test_account.sh "$HIVE_USER" "$RELEASE_ID"
          uid=$(id -u "$HIVE_USER")
          # v0.37's own AppArmor command, the one v0.34 introduced (b48227e) and v0.36 and v0.37 kept (7477c3e, 120b12c): its one profile file,
          # the Code service's and the mind launcher's, loaded to the same path this build loads; apt and linger are allowed above.
          printf '%s ALL=(root) NOPASSWD: /usr/bin/install -o root -g root -m 0644 %s %s, /usr/sbin/apparmor_parser -r %s\n' \
            "$HIVE_USER" "/home/$HIVE_USER/.local/share/omegahive/releases/linux-hive-v0.37/omegahive.apparmor" \
            "/etc/apparmor.d/omegahive-$uid" "/etc/apparmor.d/omegahive-$uid" \
            | sudo tee /etc/sudoers.d/91-hive-ci-v037 > /dev/null
          sudo chmod 0440 /etc/sudoers.d/91-hive-ci-v037
          sudo visudo -cf /etc/sudoers.d/91-hive-ci-v037
          curl -fLsS "$OLD_KIT_URL" -o "$RUNNER_TEMP/omegahive-linux-v037.sh"
          printf '%s  %s\n' "$OLD_KIT_SHA256" "$RUNNER_TEMP/omegahive-linux-v037.sh" | sha256sum -c -
          (cd "$RUNNER_TEMP/kit" && sha256sum -c omegahive-linux.sh.sha256)
          sudo install -o "$HIVE_USER" -m 0600 "$RUNNER_TEMP/omegahive-linux-v037.sh" "/home/$HIVE_USER/omegahive-linux-v037.sh"
          sudo install -o "$HIVE_USER" -m 0600 "$RUNNER_TEMP/kit/omegahive-linux.sh" "/home/$HIVE_USER/omegahive-linux.sh"
      - name: Install v0.37, uninstall it keeping conversations, then install this build over the kept data
        run: |
          uid=$(id -u "$HIVE_USER")
          as_user() { sudo -iu "$HIVE_USER" env XDG_RUNTIME_DIR="/run/user/$uid" "$@"; }
          step() {
            set +e
            # The runner owns these logs; sudo changes only the installer's identity.
            # shellcheck disable=SC2024
            sudo -iu "$HIVE_USER" bash -c "umask 077; script -qec 'sh ~/$1' /dev/null" > "$RUNNER_TEMP/$2.out" 2>&1
            code=$?
            set -e
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/$2.out"
            if [ "$code" != 0 ]; then
              # shellcheck disable=SC2016,SC2024
              sudo bash -c 'tail -n 150 -- "$(ls -t "$1"/.local/share/omegahive/logs/install-*.log | head -n 1)"' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/$2-log.out" 2>&1 || true
              python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/$2-log.out"
              exit "$code"
            fi
          }
          step omegahive-linux-v037.sh install-v037
          data="/home/$HIVE_USER/.local/share/omegahive/data"
          before=$(sudo stat -c %i "$data")
          printf '\n' | as_user "/home/$HIVE_USER/.local/bin/omegahive" uninstall > "$RUNNER_TEMP/uninstall-v037.out" 2>&1
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/uninstall-v037.out"
          grep -q "Your conversations were kept" "$RUNNER_TEMP/uninstall-v037.out"
          step omegahive-linux.sh install-upgrade
          after=$(sudo stat -c %i "$data")
          printf 'data folder inode before %s, after %s\n' "$before" "$after"
          test "$before" = "$after"
      - name: Open, sign in, restart, log out, and restart the user manager on the upgraded hive
        run: |
          sudo python3 ci/linux-x86/smoke_release.py verify "$HIVE_USER" "$RUNNER_TEMP/verification.json"
      - name: Retain secret-free verification receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          for name in install-v037 uninstall-v037 install-upgrade; do
            test ! -f "$RUNNER_TEMP/$name.out" || python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/$name.out" > "$RUNNER_TEMP/receipts/$name.out"
          done
          # shellcheck disable=SC2016,SC2024
          sudo bash -c 'cat -- "$1"/.local/share/omegahive/logs/install-*.log' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/install-log.raw" 2>&1 || true
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install-log.raw" > "$RUNNER_TEMP/receipts/install-log.txt"
          test ! -f "$RUNNER_TEMP/verification.json" || cp "$RUNNER_TEMP/verification.json" "$RUNNER_TEMP/receipts/"
          git rev-parse HEAD > "$RUNNER_TEMP/receipts/installer-commit.txt"
          lsb_release -ds > "$RUNNER_TEMP/receipts/os.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v039-upgrade-from-v037-receipts
          path: ${{ runner.temp }}/receipts/

  fresh:
    # A hosted runner already has the compilers and tools the installer needs, which a fresh Ubuntu lacks. This job
    # boots the official Ubuntu image with only what a standard install has (fresh-ubuntu.Dockerfile) and installs the
    # same download there. The container shares the runner's kernel, where it can't load AppArmor policy, so the
    # userns restriction is off here; the install jobs above prove that path on the runners themselves.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        release: ["22.04", "24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.release }}
    env:
      HIVE_USER: hiveuser
    steps:
      - uses: actions/checkout@v4
      - name: Use runner scratch outside the tested tree
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: omegahive-linux-v039-kit
          path: ${{ runner.temp }}/kit
      - name: Boot a fresh Ubuntu ${{ matrix.release }} and give it the download and a new user
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          docker build --build-arg RELEASE="$RELEASE" -t fresh-ubuntu -f ci/linux-x86/fresh-ubuntu.Dockerfile ci/linux-x86
          # A private cgroup namespace: with the host's, the container's systemd and the runner's own share paths such
          # as /user.slice/user-1001.slice, and a container user whose uid matches a runner account loses its manager.
          docker run -d --name fresh --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock fresh-ubuntu
          # systemd makes its private socket a moment after the container starts; systemctl needs it to answer at all
          for _ in $(seq 1 60); do docker exec fresh test -S /run/systemd/private && break; sleep 1; done
          docker exec fresh systemctl is-system-running --wait || docker exec fresh systemctl --failed --no-pager
          # A real Ubuntu boot mounts securityfs, where apparmor_parser loads profiles; a container's systemd skips it.
          docker exec fresh sh -c 'mountpoint -q /sys/kernel/security || mount -t securityfs securityfs /sys/kernel/security'
          docker exec fresh sh -c 'test -d /sys/kernel/security/apparmor && echo "AppArmor policy loadable"'
          docker exec fresh sh -c '. /etc/os-release && echo "$PRETTY_NAME"'
          for tool in cc cmake ninja git curl pkg-config; do
            if docker exec fresh sh -c "command -v $tool"; then echo "the fresh image already has $tool"; exit 1; fi
          done
          docker cp ci/linux-x86/test_account.sh fresh:/root/test_account.sh
          docker exec fresh sh /root/test_account.sh "$HIVE_USER" "$RELEASE_ID"
          cd "$RUNNER_TEMP/kit"
          sha256sum -c omegahive-linux.sh.sha256
          docker cp omegahive-linux.sh "fresh:/home/$HIVE_USER/omegahive-linux.sh"
          docker exec fresh sh -c "chown $HIVE_USER:$HIVE_USER /home/$HIVE_USER/omegahive-linux.sh && chmod 0600 /home/$HIVE_USER/omegahive-linux.sh"
      - name: Run the exact download as the fresh user
        run: |
          set +e
          docker exec fresh sudo -iu "$HIVE_USER" bash -c "umask 077; script -qec 'sh ~/omegahive-linux.sh' /dev/null" > "$RUNNER_TEMP/install.out" 2>&1
          code=$?
          set -e
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install.out"
          if [ "$code" != 0 ]; then
            # shellcheck disable=SC2016
            docker exec fresh bash -c 'tail -n 150 -- "$1"/.local/share/omegahive/logs/install-*.log' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/install-log.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install-log.out"
            docker exec fresh sh -c "sudo -iu $HIVE_USER env XDG_RUNTIME_DIR=/run/user/\$(id -u $HIVE_USER) journalctl --user -u omegahive.service --no-pager -n 80" > "$RUNNER_TEMP/journal.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/journal.out"
            # Whether this account's user manager runs, and what logind and systemd said about it.
            docker exec fresh sh -c "loginctl list-users; loginctl list-sessions; loginctl show-user $HIVE_USER; ls -la /run/user /run/user/*; systemctl status 'user@*' 'user-runtime-dir@*' --no-pager -l; journalctl -b -u 'user@*' -u 'user-runtime-dir@*' -u systemd-logind --no-pager -n 150 -o short-precise" > "$RUNNER_TEMP/manager.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/manager.out"
            # How systemctl --user fails to reach that manager: its sockets, its environment, and the traced connect.
            # shellcheck disable=SC2016
            docker exec fresh bash -c 'u=$1; uid=$(id -u "$u"); r=/run/user/$uid; ls -la "$r/systemd" /etc/pam.d/systemd-user
              pid=$(pgrep -u "$u" -x systemd | head -1); echo "manager pid $pid"; tr "\0" "\n" < "/proc/$pid/environ" | grep -E "^(XDG|DBUS|HOME|USER)"
              sudo -iu "$u" env XDG_RUNTIME_DIR="$r" systemctl --user is-system-running; echo "is-system-running exit $?"
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq strace > /dev/null 2>&1
              sudo -iu "$u" env -i HOME="/home/$u" PATH=/usr/bin:/bin XDG_RUNTIME_DIR="$r" DBUS_SESSION_BUS_ADDRESS="unix:path=$r/bus" strace -f -e trace=connect,socket systemctl --user daemon-reload 2>&1 | tail -n 15' bash "$HIVE_USER" > "$RUNNER_TEMP/bus.out" 2>&1 || true
            python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/bus.out"
          fi
          exit "$code"
      - name: The installer added every build prerequisite itself
        run: |
          for tool in cc cmake ninja git curl pkg-config; do docker exec fresh sh -c "command -v $tool"; done
      - name: Open, sign in, restart, log out, and restart the user manager in the fresh Ubuntu
        run: |
          docker cp ci/linux-x86/smoke_release.py fresh:/root/smoke_release.py
          docker cp ci/linux-x86/x86_64-pins.json fresh:/root/x86_64-pins.json
          docker exec fresh python3 /root/smoke_release.py verify "$HIVE_USER" /root/verification.json
      - name: Retain secret-free verification receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          test ! -f "$RUNNER_TEMP/install.out" || python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install.out" > "$RUNNER_TEMP/receipts/install.out"
          # shellcheck disable=SC2016
          docker exec fresh bash -c 'cat -- "$1"/.local/share/omegahive/logs/install-*.log' bash "/home/$HIVE_USER" > "$RUNNER_TEMP/install-log.raw" 2>&1 || true
          python3 ci/linux-x86/smoke_release.py redact "$RUNNER_TEMP/install-log.raw" > "$RUNNER_TEMP/receipts/install-log.txt"
          docker cp fresh:/root/verification.json "$RUNNER_TEMP/receipts/verification.json" || true
          docker exec fresh sh -c '. /etc/os-release && echo "$PRETTY_NAME"' > "$RUNNER_TEMP/receipts/os.txt" || true
          git rev-parse HEAD > "$RUNNER_TEMP/receipts/installer-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v039-fresh-ubuntu-${{ matrix.release }}-receipts
          path: ${{ runner.temp }}/receipts/
