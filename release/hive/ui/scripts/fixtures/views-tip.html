<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip calculator</title>
<!-- An invented view, written the way a mind writes one: one page, its script and style inline, nothing from the
     network. Used by scripts/views-check.mjs. -->
<style>
  :root { color-scheme: dark; --bg: #0b0b22; --card: #14143a; --ink: #eceaff; --ink2: #a9a8d6; --line: rgba(170, 170, 255, .18);
          --accent: #a493ff; --accent2: #6ee7ff; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #f6f5ff; --card: #ffffff; --ink: #1b1a3a; --ink2: #5a5980; --line: rgba(60, 60, 120, .16); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink);
         background: radial-gradient(900px 320px at 0% -20%, rgba(164, 147, 255, .28), transparent 70%) no-repeat, var(--bg); }
  .card { max-width: 620px; margin: 0 auto; padding: 18px 20px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  header small { color: var(--ink2); }
  label, .label { display: block; margin: 14px 0 6px; color: var(--ink2); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }
  .bill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 14px; }
  .bill span { color: var(--ink2); font-size: 22px; }
  .bill input { flex: 1; min-width: 0; padding: 4px 0; border: 0; outline: 0; color: var(--ink); background: transparent; font: inherit; font-size: 26px; font-weight: 600; }
  .tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .tips button { padding: 10px 0; border: 1px solid var(--line); border-radius: 12px; background: transparent; }
  .tips button[aria-pressed="true"] { border-color: transparent; color: #0b0820; font-weight: 600; background: linear-gradient(180deg, #c3b9ff, #8f7dff); }
  .people { display: flex; align-items: center; gap: 14px; }
  .people button { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: transparent; font-size: 20px; }
  .people output { min-width: 2ch; font-size: 22px; font-weight: 600; text-align: center; }
  .result { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .stat span { color: var(--ink2); font-size: 12px; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .split { display: flex; height: 10px; margin-top: 14px; overflow: hidden; border-radius: 5px; background: var(--line); }
  .split i { display: block; height: 100%; border-right: 2px solid var(--card); background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: flex-grow .25s; }
  .note { margin: 10px 0 0; color: var(--ink2); font-size: 12.5px; }
  @media (max-width: 420px) { body { padding: 10px; } .card { padding: 14px; } .stat b { font-size: 24px; } }
</style>
</head>
<body>
<main class="card">
  <header><h1>Tip calculator</h1><small id="remembered"></small></header>
  <label for="bill">Bill</label>
  <div class="bill"><span>$</span><input id="bill" type="number" inputmode="decimal" min="0" step="0.01" value="84.50"></div>
  <span class="label" id="tip-label">Tip</span>
  <div class="tips" role="group" aria-labelledby="tip-label">
    <button data-tip="10">10%</button><button data-tip="15">15%</button><button data-tip="18">18%</button><button data-tip="20">20%</button>
  </div>
  <span class="label">People</span>
  <div class="people"><button id="fewer" aria-label="Fewer people">−</button><output id="people">3</output><button id="more" aria-label="More people">+</button></div>
  <div class="result">
    <div class="stat"><span>Each pays</span><b id="each">$0.00</b></div>
    <div class="stat"><span>Tip in total</span><b id="tip">$0.00</b></div>
  </div>
  <div class="split" id="split" aria-hidden="true"></div>
  <p class="note" id="note"></p>
</main>
<script>
  const money = (n) => '$' + (Math.round(n * 100) / 100).toFixed(2)
  const state = { tip: Number(localStorage.getItem('tip') || 15), people: 3 }
  const $ = (id) => document.getElementById(id)
  function draw() {
    const bill = Math.max(0, Number($('bill').value) || 0)
    const tip = bill * state.tip / 100
    $('each').textContent = money((bill + tip) / state.people)
    $('tip').textContent = money(tip)
    $('people').value = state.people
    document.querySelectorAll('.tips button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.tip) === state.tip)))
    $('split').innerHTML = '<i></i>'.repeat(state.people)
    $('split').querySelectorAll('i').forEach((i) => { i.style.flexGrow = '1' })
    $('note').textContent = `${money(bill)} with a ${state.tip}% tip, split ${state.people} ways.`
  }
  document.querySelectorAll('.tips button').forEach((b) => b.addEventListener('click', () => {
    state.tip = Number(b.dataset.tip)
    localStorage.setItem('tip', String(state.tip))
    $('remembered').textContent = `remembers ${state.tip}%`
    draw()
  }))
  $('fewer').addEventListener('click', () => { state.people = Math.max(1, state.people - 1); draw() })
  $('more').addEventListener('click', () => { state.people = Math.min(20, state.people + 1); draw() })
  $('bill').addEventListener('input', draw)
  draw()
</script>
</body>
</html>
