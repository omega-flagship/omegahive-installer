name: code-lifecycle (test only)

# OmegaCode Linux lifecycle qualification (sealed bundle R1, manifest 154b87bf) for the R13 Code package: fresh user unit,
# health, stop/start, R1.4 -> R1.5.2 -> R1.4 rollback, uninstall with state kept, plus refusal/timeout/SIGTERM/SIGKILL controls.
# Own branch pattern so it never triggers the installer/mac-native workflow. Synthetic state only.

on:
  workflow_dispatch:
  push:
    branches: ["ci/code-lifecycle-*"]

permissions:
  contents: read

jobs:
  code-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify the sealed lifecycle bundle and the two exact package archives
        run: |
          set -euo pipefail
          printf '%s  %s\n' 154b87bf789af16ca313101fed2c3be2ec5ba735cb214b3f5ece7dd80020e7e3 ci/code-lifecycle/MANIFEST.sha256 | sha256sum -c -
          (cd ci/code-lifecycle && sha256sum --strict --check MANIFEST.sha256)
          printf '%s  %s\n' c7478c1e88ed5fd777890196d572cf347c3a38240810b3911836081c8674fea1 ci/code-lifecycle/inputs/OMEGACODE_R13_SUCCESSOR_R1_4_P3_FOLLOWUP_REVIEW.zip | sha256sum -c -
          printf '%s  %s\n' c6f0e7c2380fee230ee8081e097a231d7c7d731afec82ff24ae86041637638f1 ci/code-lifecycle/inputs/OMEGACODE_R13_SUCCESSOR_R1_5_2_TRACE_API_REVIEW.zip | sha256sum -c -
          { uname -a; lsb_release -ds; systemctl --version | head -1; ps -p 1 -o comm=; stat -fc %T /sys/fs/cgroup; } | tee /tmp/lc-facts.txt
      - name: Pinned Python and uv (checked against the publisher)
        run: |
          umask 022   # runner default is 0002; the lifecycle runtime preflight refuses group/other-writable runtime paths
          P=ci/linux-x86/x86_64-pins.json
          U=$(python3 -c "import json;print(json.load(open('$P'))['python_stripped']['url'])"); H=$(python3 -c "import json;print(json.load(open('$P'))['python_stripped']['sha256'])")
          curl -fsSL -o /tmp/pbs.tar.gz "$U" && echo "$H  /tmp/pbs.tar.gz" | sha256sum -c -
          mkdir -p /tmp/py && tar -xzf /tmp/pbs.tar.gz -C /tmp/py
          U=$(python3 -c "import json;print(json.load(open('$P'))['uv']['url'])"); H=$(python3 -c "import json;print(json.load(open('$P'))['uv']['sha256'])")
          curl -fsSL -o /tmp/uv.tgz "$U" && echo "$H  /tmp/uv.tgz" | sha256sum -c -
          mkdir -p /tmp/uvx && tar -xzf /tmp/uv.tgz -C /tmp/uvx
          echo "UV=$(find /tmp/uvx -name uv -type f | head -1)" >> "$GITHUB_ENV"
          /tmp/py/python/bin/python3.12 -VV
      - name: Separate bare PBS venv with the exact 17-package runtime lock (CI_INTEGRATION.md)
        run: |
          set -euo pipefail
          umask 022
          test ! -e /tmp/lifecyclevenv
          /tmp/py/python/bin/python3.12 -m venv --without-pip /tmp/lifecyclevenv
          printf '%s  %s\n' \
            d31b5e35f103c7d7d7d75649ff93ba2786e0113fb49197adf0480fd9a5552db5 \
            ci/code-c2/CODE_R10_X86_RUNTIME_REQUIREMENTS_R1.lock | sha256sum -c -
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$UV" --no-config pip install \
            --python /tmp/lifecyclevenv/bin/python \
            --require-hashes --no-deps --only-binary=:all: \
            -r ci/code-c2/CODE_R10_X86_RUNTIME_REQUIREMENTS_R1.lock
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$UV" --no-config pip check \
            --python /tmp/lifecyclevenv/bin/python
          # No group/other write anywhere on the runtime trees (provisioning hygiene, not a guard change); show the result.
          chmod -R go-w /tmp/py /tmp/lifecyclevenv
          echo "group/other-writable entries left: $(find /tmp/py /tmp/lifecyclevenv -perm /022 ! -type l | wc -l)"
          stat -c '%a %U %n' /tmp /tmp/py /tmp/py/python /tmp/lifecyclevenv /tmp/lifecyclevenv/bin
      - name: Native lifecycle qualification (full, refusal, timeout, sigterm, sigkill)
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -B "$GITHUB_WORKSPACE/ci/code-lifecycle/supervise.py" run \
            --r14-archive "$GITHUB_WORKSPACE/ci/code-lifecycle/inputs/OMEGACODE_R13_SUCCESSOR_R1_4_P3_FOLLOWUP_REVIEW.zip" \
            --r152-archive "$GITHUB_WORKSPACE/ci/code-lifecycle/inputs/OMEGACODE_R13_SUCCESSOR_R1_5_2_TRACE_API_REVIEW.zip" \
            --python /tmp/lifecyclevenv/bin/python \
            --runtime-lock "$GITHUB_WORKSPACE/ci/code-c2/CODE_R10_X86_RUNTIME_REQUIREMENTS_R1.lock" \
            --output-dir /var/tmp/omegacode-lifecycle-receipts
      - name: Collect the sanitized JSON receipt tree (always; keeps the step failure)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lifecycle-receipts
          if sudo test -d /var/tmp/omegacode-lifecycle-receipts; then
            sudo cp -a /var/tmp/omegacode-lifecycle-receipts/. lifecycle-receipts/
            sudo chown -R "$(id -u):$(id -g)" lifecycle-receipts
            find lifecycle-receipts -type d -exec chmod 0700 {} +
            find lifecycle-receipts -type f -exec chmod 0600 {} +
          fi
          cp /tmp/lc-facts.txt lifecycle-receipts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-lifecycle-receipts
          path: lifecycle-receipts/
